<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--bg); }
  .row { display:grid; grid-template-columns: 60px 1fr 120px; align-items: baseline; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .row:last-child { border-bottom: 0; }
  .tag { font: 600 10px var(--font-sans); color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .meta { font: 400 10px var(--font-mono); color: var(--fg-subtle); text-align: right; }
</style></head><body>
<div class="row"><span class="tag">Display</span><span class="display-xl">Expediente</span><span class="meta">Source Serif 4 · 700 · 48/tight</span></div>
<div class="row"><span class="tag">Display</span><span class="display-lg">Expediente</span><span class="meta">Source Serif 4 · 700 · 36/tight</span></div>
<div class="row"><span class="tag">Display</span><span class="display-md">Expediente ciudadano</span><span class="meta">Source Serif 4 · 600 · 28/snug</span></div>
</body></html>
