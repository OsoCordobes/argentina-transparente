<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--bg); }
  .title { font: 600 11px var(--font-sans); color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .cell h4 { margin: 0; padding: 8px 10px; font: 600 11px var(--font-sans); border-bottom: 1px solid var(--border); background: var(--bg-subtle); }
  .strip { display: flex; height: 40px; }
  .strip span { flex: 1; }
  .badge-row { display: flex; gap: 6px; padding: 10px; }
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; border: 1px solid; font: 600 10px var(--font-sans); letter-spacing: 0.04em; text-transform: uppercase; }
</style></head><body>
<div class="title">Severity / Semantic signals</div>
<div class="grid">
  <div class="cell">
    <h4 style="color:#b91c1c">GRAVE</h4>
    <div class="strip"><span style="background:#fee2e2"></span><span style="background:#fca5a5"></span><span style="background:#ef4444"></span><span style="background:#b91c1c"></span></div>
    <div class="badge-row"><span class="badge" style="background:#fee2e2;border-color:#fca5a5;color:#b91c1c">Grave · 92</span></div>
  </div>
  <div class="cell">
    <h4 style="color:#b45309">MODERADA</h4>
    <div class="strip"><span style="background:#fef3c7"></span><span style="background:#fcd34d"></span><span style="background:#f59e0b"></span><span style="background:#b45309"></span></div>
    <div class="badge-row"><span class="badge" style="background:#fef3c7;border-color:#fcd34d;color:#b45309">Moderada · 64</span></div>
  </div>
  <div class="cell">
    <h4 style="color:#15803d">VERIFICADO</h4>
    <div class="strip"><span style="background:#dcfce7"></span><span style="background:#86efac"></span><span style="background:#22c55e"></span><span style="background:#15803d"></span></div>
    <div class="badge-row"><span class="badge" style="background:#dcfce7;border-color:#86efac;color:#15803d">Verificado</span></div>
  </div>
</div>
</body></html>
