<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--bg); font-family: var(--font-sans); }
  .title { font: 600 11px var(--font-sans); color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 14px; }
  .node { display:inline-block; border: 2px solid; border-radius: 8px; padding: 8px 12px; min-width: 140px; background: #fff; box-shadow: var(--shadow-xs); }
  .node .tag { font: 600 9px var(--font-sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-muted); display:flex; align-items:center; gap:4px; margin-bottom: 2px; }
  .node .name { font: 600 12px var(--font-sans); color: var(--gray-900); line-height: 1.25; }
  .row { display:flex; gap: 16px; flex-wrap: wrap; align-items: center; }
  svg.icon { width: 11px; height: 11px; }
</style></head><body>
<div class="title">Graph nodes — React Flow entity cards</div>
<div class="row">
  <div class="node" style="background:#eff6ff; border-color:#93c5fd">
    <div class="tag" style="color:#1d4ed8"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21V11h6v10"/></svg>Empresa</div>
    <div class="name">TECNOSERV SA</div>
  </div>
  <div class="node" style="background:#ecfdf5; border-color:#6ee7b7">
    <div class="tag" style="color:#047857"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M20 21a8 8 0 1 0-16 0"/></svg>Persona</div>
    <div class="name">Juan Pérez</div>
  </div>
  <div class="node" style="background:#fffbeb; border-color:#fcd34d">
    <div class="tag" style="color:#b45309"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>Contrato</div>
    <div class="name">CT-4821/2023</div>
  </div>
</div>
</body></html>
