<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--bg); font-family: var(--font-sans); }
  table { width: 100%; border-collapse: collapse; }
  th { font: 600 10px var(--font-sans); color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.06em; text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); background: var(--bg-subtle); }
  td { font: 400 12px var(--font-sans); color: var(--gray-900); padding: 8px 10px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: var(--bg-subtle); }
  td.right { text-align: right; font-variant-numeric: tabular-nums; }
  td.mono { font-family: var(--font-mono); color: var(--fg-muted); font-size: 11px; }
  .src { color: var(--blue-600); font-size: 11px; }
</style></head><body>
<table>
  <thead><tr><th>Año</th><th>Área</th><th>Tipo</th><th class="right">Monto</th><th class="right">Fuente</th></tr></thead>
  <tbody>
    <tr><td class="mono">2023</td><td>Obras Públicas</td><td>Contratación directa</td><td class="right">$ 48.200.000</td><td class="right"><a href="#" class="src">fuente</a></td></tr>
    <tr><td class="mono">2023</td><td>Salud</td><td>Licitación pública</td><td class="right">$ 32.150.000</td><td class="right"><a href="#" class="src">fuente</a></td></tr>
    <tr><td class="mono">2022</td><td>Obras Públicas</td><td>Prórroga</td><td class="right">$ 19.800.000</td><td class="right"><a href="#" class="src">fuente</a></td></tr>
    <tr><td class="mono">2022</td><td>Servicios</td><td>Contratación directa</td><td class="right">$ 8.450.000</td><td class="right"><a href="#" class="src">fuente</a></td></tr>
  </tbody>
</table>
</body></html>
