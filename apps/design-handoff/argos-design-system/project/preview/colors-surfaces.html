<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 0; }
  .two { display: grid; grid-template-columns: 1fr 1fr; border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
  .surface { padding: 16px; min-height: 180px; }
  .light { background: #fff; color: var(--gray-900); }
  .dark  { background: #020617; color: #fff; }
  .label { font: 600 10px var(--font-sans); text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.7; margin-bottom: 10px; }
  .card { border: 1px solid; border-radius: var(--radius); padding: 10px; margin-bottom: 8px; }
  .light .card { border-color: #e2e8f0; background: #fff; }
  .dark .card  { border-color: #1e293b; background: #0f172a; }
  h3 { font: 600 13px var(--font-sans); margin: 0 0 2px; }
  p { margin: 0; font: 400 11px var(--font-sans); }
  .light p { color: var(--gray-600); }
  .dark p { color: #94a3b8; }
  .mono { font: 400 11px var(--font-mono); margin-top: 6px; }
  .light .mono { color: var(--gray-500); }
  .dark .mono { color: #64748b; }
</style></head><body>
<div class="two">
  <div class="surface light">
    <div class="label">Light · Investigator workspace</div>
    <div class="card"><h3>TECNOSERV SA</h3><p>18 contratos · Córdoba Capital</p><div class="mono">CUIT 30-71234567-9</div></div>
    <div class="card"><h3>Ordenanza 12.345</h3><p>Régimen de contrataciones directas</p></div>
  </div>
  <div class="surface dark">
    <div class="label">Dark · Public expediente</div>
    <div class="card"><h3>TECNOSERV SA</h3><p>18 contratos · Córdoba Capital</p><div class="mono">CUIT 30-71234567-9</div></div>
    <div class="card"><h3>Ordenanza 12.345</h3><p>Régimen de contrataciones directas</p></div>
  </div>
</div>
</body></html>
