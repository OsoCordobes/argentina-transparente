<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--bg); font-family: var(--font-sans); }
  .title { font: 600 11px var(--font-sans); color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 10px; }
  .stack { display:flex; flex-direction: column; gap: 10px; max-width: 520px; }
  label { font: 600 11px var(--font-sans); color: var(--fg); }
  input, select, textarea { font: 400 13px var(--font-sans); padding: 7px 10px; border: 1px solid var(--gray-300); border-radius: 6px; background: #fff; width: 100%; box-sizing: border-box; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--blue-600); box-shadow: 0 0 0 3px rgba(37,99,235,.25); }
  .with-icon { position: relative; }
  .with-icon svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--fg-muted); }
  .with-icon input { padding-left: 32px; }
</style></head><body>
<div class="title">Inputs</div>
<div class="stack">
  <div class="with-icon">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input placeholder="Empresa, persona, contrato…" />
  </div>
  <div>
    <label>Municipio</label>
    <select><option>Córdoba Capital</option><option>Villa María</option></select>
  </div>
  <div>
    <label>Nota de investigación</label>
    <textarea rows="3" placeholder="Agregar nota sobre esta entidad…"></textarea>
  </div>
</div>
</body></html>
