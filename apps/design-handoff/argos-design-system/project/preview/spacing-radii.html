<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:20px; background: var(--bg); }
  .title { font: 600 11px var(--font-sans); color: var(--fg-muted); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 14px; }
  .row { display:flex; gap: 20px; align-items: flex-end; }
  .tile { width: 80px; height: 60px; background: var(--gray-100); border: 1px solid var(--border); display:flex; align-items:flex-end; justify-content:center; padding: 6px; }
  .tile span { font: 600 10px var(--font-sans); color: var(--fg-muted); }
  .r-sm { border-radius: 4px; } .r-md { border-radius: 6px; } .r-lg { border-radius: 8px; } .r-xl { border-radius: 12px; } .r-2xl { border-radius: 16px; } .r-pill { border-radius: 999px; }
</style></head><body>
<div class="title">Radii</div>
<div class="row">
  <div class="tile r-sm"><span>4 · sm</span></div>
  <div class="tile r-md"><span>6 · default</span></div>
  <div class="tile r-lg"><span>8 · md</span></div>
  <div class="tile r-xl"><span>12 · lg</span></div>
  <div class="tile r-2xl"><span>16 · xl</span></div>
  <div class="tile r-pill"><span>999 · pill</span></div>
</div>
</body></html>
