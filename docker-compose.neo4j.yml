services:
  neo4j:
    image: neo4j:5.21-community
    container_name: argos-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP UI (http://localhost:7474)
      - "7687:7687"   # Bolt protocol (cliente neo4j-driver)
    environment:
      NEO4J_AUTH: neo4j/argos_local
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 1G
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_apoc_export_file_enabled: 'true'
      NEO4J_apoc_import_file_enabled: 'true'
      NEO4J_apoc_import_file_use__neo4j__config: 'true'
    volumes:
      - argos_neo4j_data:/data
      - argos_neo4j_logs:/logs
      - argos_neo4j_import:/var/lib/neo4j/import
      - argos_neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "argos_local", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  argos_neo4j_data:
  argos_neo4j_logs:
  argos_neo4j_import:
  argos_neo4j_plugins:
